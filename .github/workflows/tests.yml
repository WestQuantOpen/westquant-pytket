name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout WestQuant Core
        uses: actions/checkout@v4
        with:
          repository: WestQuantOpen/westquant-core
          path: _westquant-core
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./_westquant-core[test]
          pip install -e .[test]
      - name: Unit tests
        run: pytest -q
      - name: Native SDK smoke
        run: python integration/smoke.py
